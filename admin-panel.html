<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>用户管理系统</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 15px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #333; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid #f0f0f0; }
    
    .dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; padding: 20px; border-radius: 10px; text-align: center; }
    .stat-value { font-size: 36px; font-weight: bold; margin: 10px 0; }
    
    .panel { background: #f8f9fa; border-radius: 10px; padding: 20px; margin-bottom: 20px; border-left: 5px solid #007bff; }
    h2 { color: #495057; margin-bottom: 20px; }
    
    .form-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
    input, select, textarea { flex: 1; min-width: 200px; padding: 10px; border: 1px solid #dee2e6; border-radius: 5px; }
    button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .btn-secondary { background: #6c757d; color: white; }
    .btn-danger { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; }
    .btn-success { background: #28a745; color: white; }
    
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
    th { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px; text-align: left; }
    td { padding: 12px 15px; border-bottom: 1px solid #dee2e6; }
    tr:hover { background-color: #f8f9fa; }
    
    .actions { display: flex; gap: 5px; }
    .action-btn { padding: 5px 10px; font-size: 12px; }
    
    .alert { padding: 15px; border-radius: 5px; margin: 10px 0; display: none; }
    .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    
    .loading { text-align: center; padding: 20px; color: #6c757d; }
  </style>
</head>
<body>
  <div class="container">
    <h1>👨‍💼 用户管理系统</h1>
    
    <!-- 统计面板 -->
    <div class="dashboard">
      <div class="stat-card">
        <div>总用户数</div>
        <div class="stat-value" id="totalUsers">0</div>
      </div>
      <div class="stat-card">
        <div>学生用户</div>
        <div class="stat-value" id="studentUsers">0</div>
      </div>
      <div class="stat-card">
        <div>教师用户</div>
        <div class="stat-value" id="teacherUsers">0</div>
      </div>
      <div class="stat-card">
        <div>活跃用户</div>
        <div class="stat-value" id="activeUsers">0</div>
      </div>
    </div>
    
    <!-- 添加用户 -->
    <div class="panel">
      <h2>➕ 添加用户</h2>
      <div id="addAlert" class="alert"></div>
      <div class="form-group">
        <input id="username" placeholder="用户名" required>
        <input id="name" placeholder="姓名" required>
        <input id="class" placeholder="班级/部门" required>
        <input id="password" placeholder="密码（默认123456）" type="password">
        <select id="role">
          <option value="student">学生</option>
          <option value="teacher">教师</option>
          <option value="admin">管理员</option>
        </select>
        <button class="btn-primary" onclick="addUser()">添加用户</button>
      </div>
    </div>
    
    <!-- 批量导入 -->
    <div class="panel">
      <h2>📤 批量导入</h2>
      <textarea id="batchData" placeholder="请输入CSV格式数据（用户名,姓名,班级,密码(可选)）" rows="4"></textarea>
      <div class="form-group">
        <button class="btn-secondary" onclick="batchImport()">批量导入</button>
        <button class="btn-success" onclick="exportUsers()">导出CSV</button>
      </div>
    </div>
    
    <!-- 搜索 -->
    <div class="panel">
      <h2>🔍 搜索用户</h2>
      <div class="form-group">
        <input id="searchInput" placeholder="搜索用户名、姓名、班级..." style="flex: 2;">
        <button class="btn-secondary" onclick="searchUsers()">搜索</button>
        <button onclick="resetSearch()">重置</button>
      </div>
    </div>
    
    <!-- 用户列表 -->
    <div class="panel">
      <h2>👥 用户列表</h2>
      <div id="tableAlert" class="alert"></div>
      <div id="loading" class="loading">加载中...</div>
      <table id="userTable">
        <thead>
          <tr>
            <th>用户名</th>
            <th>姓名</th>
            <th>班级/部门</th>
            <th>角色</th>
            <th>状态</th>
            <th>创建时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    // ================== 初始化阶段 ==================
    let supabase;
    let usersCache = [];
    
    // 1. Supabase配置
    const SUPABASE_CONFIG = {
      url: 'https://wxbemuwgiiucdgmbhbvg.supabase.co',
      key: 'sb_publishable_KuzTRmYOZ9P6UmKgmb_VwA_6Qj_A6Nk'
    };
    
    // 2. 初始化函数
    async function initSupabase() {
      try {
        if (!window.supabase || typeof window.supabase.createClient !== 'function') {
          throw new Error('Supabase SDK未加载，请检查网络连接');
        }
        
        supabase = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.key);
        console.log('✅ Supabase客户端初始化成功');
        return true;
      } catch (error) {
        console.error('❌ Supabase初始化失败:', error);
        showAlert('tableAlert', '数据库连接失败: ' + error.message, 'error');
        return false;
      }
    }
    
    // 3. 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', async function() {
      console.log('📄 页面加载完成，开始初始化...');
      
      // 初始化Supabase
      const initialized = await initSupabase();
      if (!initialized) return;
      
      // 加载用户数据
      await loadUsers();
      
      // 绑定事件
      setupEventListeners();
    });
    
    // ================== 核心功能函数 ==================
    
    // 加载用户数据 - 表名已改为members
    async function loadUsers() {
      try {
        showLoading(true);
        
        if (!supabase || typeof supabase.from !== 'function') {
          throw new Error('数据库连接未就绪');
        }
        
        const { data, error } = await supabase
          .from('members')  // 表名从users改为members
          .select('*')
          .order('created_at', { ascending: false });
        
        if (error) {
          if (error.code === 'PGRST205') {
            throw new Error('数据表不存在，请先在Supabase中创建members表');
          }
          throw error;
        }
        
        usersCache = data || [];
        renderUserTable(usersCache);
        updateStats(usersCache);
        showAlert('tableAlert', `成功加载 ${usersCache.length} 个用户`, 'success');
      } catch (error) {
        console.error('加载用户失败:', error);
        showAlert('tableAlert', '加载用户失败: ' + error.message, 'error');
        renderUserTable([]);
      } finally {
        showLoading(false);
      }
    }
    
    // 渲染用户表格
    function renderUserTable(users) {
      const tbody = document.querySelector('#userTable tbody');
      tbody.innerHTML = '';
      
      if (!users || users.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" style="text-align: center; padding: 40px; color: #6c757d;">
              <div style="font-size: 48px; margin-bottom: 10px;">📭</div>
              <div>暂无用户数据</div>
            </td>
          </tr>
        `;
        return;
      }
      
      users.forEach(user => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${user.username || '-'}</td>
          <td>${user.name || '-'}</td>
          <td>${user.class || '-'}</td>
          <td><span class="role-badge">${getRoleLabel(user.role)}</span></td>
          <td><span class="status-badge ${user.status ? 'active' : 'inactive'}">${user.status ? '活跃' : '禁用'}</span></td>
          <td>${formatDate(user.created_at)}</td>
          <td>
            <div class="actions">
              <button class="action-btn" onclick="editUser('${user.id}')">编辑</button>
              <button class="action-btn" onclick="toggleUserStatus('${user.id}', ${!user.status})">${user.status ? '禁用' : '启用'}</button>
              <button class="action-btn btn-danger" onclick="deleteUser('${user.id}')">删除</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
      
      // 添加样式
      addTableStyles();
    }
    
    // 添加用户 - 表名已改为members
    async function addUser() {
      try {
        const username = document.getElementById('username').value.trim();
        const name = document.getElementById('name').value.trim();
        const className = document.getElementById('class').value.trim();
        const password = document.getElementById('password').value.trim() || '123456';
        const role = document.getElementById('role').value;
        
        if (!username || !name || !className) {
          throw new Error('请填写完整信息');
        }
        
        if (!supabase) {
          throw new Error('数据库连接异常');
        }
        
        const { error } = await supabase
          .from('members')  // 表名从users改为members
          .insert([{
            username,
            name,
            class: className,
            password,
            role,
            status: true,
            created_at: new Date().toISOString()
          }]);
        
        if (error) throw error;
        
        showAlert('addAlert', '用户添加成功！', 'success');
        clearAddForm();
        await loadUsers();
      } catch (error) {
        console.error('添加用户失败:', error);
        showAlert('addAlert', '添加用户失败: ' + error.message, 'error');
      }
    }
    
    // 批量导入 - 表名已改为members
    async function batchImport() {
      const csvData = document.getElementById('batchData').value.trim();
      if (!csvData) {
        showAlert('addAlert', '请输入CSV数据', 'error');
        return;
      }
      
      const lines = csvData.split('\n');
      const usersToAdd = [];
      let successCount = 0;
      
      for (const line of lines) {
        const [username, name, className, password] = line.split(',').map(item => item?.trim());
        if (username && name && className) {
          usersToAdd.push({
            username,
            name,
            class: className,
            password: password || '123456',
            role: username.toLowerCase().includes('teacher') ? 'teacher' : 'student',
            status: true,
            created_at: new Date().toISOString()
          });
        }
      }
      
      if (usersToAdd.length === 0) {
        showAlert('addAlert', '没有找到有效数据', 'error');
        return;
      }
      
      try {
        for (const user of usersToAdd) {
          const { error } = await supabase
            .from('members')  // 表名从users改为members
            .insert([user]);
          
          if (!error) successCount++;
        }
        
        showAlert('addAlert', `成功导入 ${successCount}/${usersToAdd.length} 个用户`, 'success');
        document.getElementById('batchData').value = '';
        await loadUsers();
      } catch (error) {
        showAlert('addAlert', '批量导入失败: ' + error.message, 'error');
      }
    }
    
    // 搜索用户
    function searchUsers() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      
      if (!keyword) {
        showAlert('tableAlert', '请输入搜索关键词', 'error');
        return;
      }
      
      const filtered = usersCache.filter(user =>
        (user.username && user.username.toLowerCase().includes(keyword)) ||
        (user.name && user.name.toLowerCase().includes(keyword)) ||
        (user.class && user.class.toLowerCase().includes(keyword))
      );
      
      renderUserTable(filtered);
      showAlert('tableAlert', `找到 ${filtered.length} 个匹配结果`, 'success');
    }
    
    // 编辑用户 - 表名已改为members
    async function editUser(id) {
      const user = usersCache.find(u => u.id === id);
      if (!user) return;
      
      const newName = prompt('请输入新姓名:', user.name);
      if (newName === null) return;
      
      const newClass = prompt('请输入新班级:', user.class);
      if (newClass === null) return;
      
      try {
        const { error } = await supabase
          .from('members')  // 表名从users改为members
          .update({ name: newName, class: newClass })
          .eq('id', id);
        
        if (error) throw error;
        
        showAlert('tableAlert', '用户信息已更新', 'success');
        await loadUsers();
      } catch (error) {
        showAlert('tableAlert', '更新失败: ' + error.message, 'error');
      }
    }
    
    // 切换用户状态 - 表名已改为members
    async function toggleUserStatus(id, newStatus) {
      try {
        const { error } = await supabase
          .from('members')  // 表名从users改为members
          .update({ status: newStatus })
          .eq('id', id);
        
        if (error) throw error;
        
        showAlert('tableAlert', `用户已${newStatus ? '启用' : '禁用'}`, 'success');
        await loadUsers();
      } catch (error) {
        showAlert('tableAlert', '状态更新失败: ' + error.message, 'error');
      }
    }
    
    // 删除用户 - 表名已改为members
    async function deleteUser(id) {
      if (!confirm('确定要删除这个用户吗？此操作不可撤销。')) return;
      
      try {
        const { error } = await supabase
          .from('members')  // 表名从users改为members
          .delete()
          .eq('id', id);
        
        if (error) throw error;
        
        showAlert('tableAlert', '用户已删除', 'success');
        await loadUsers();
      } catch (error) {
        showAlert('tableAlert', '删除失败: ' + error.message, 'error');
      }
    }
    
    // 导出CSV
    function exportUsers() {
      if (usersCache.length === 0) {
        showAlert('tableAlert', '没有数据可导出', 'error');
        return;
      }
      
      let csv = '用户名,姓名,班级,角色,状态\n';
      usersCache.forEach(user => {
        csv += `${user.username},${user.name},${user.class},${getRoleLabel(user.role)},${user.status ? '活跃' : '禁用'}\n`;
      });
      
      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `用户数据_${new Date().toISOString().split('T')[0]}.csv`;
      link.click();
    }
    
    // ================== 辅助函数 ==================
    
    function setupEventListeners() {
      // 回车键搜索
      document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') searchUsers();
      });
    }
    
    function updateStats(users) {
      const total = users.length;
      const students = users.filter(u => u.role === 'student').length;
      const teachers = users.filter(u => u.role === 'teacher').length;
      const active = users.filter(u => u.status).length;
      
      document.getElementById('totalUsers').textContent = total;
      document.getElementById('studentUsers').textContent = students;
      document.getElementById('teacherUsers').textContent = teachers;
      document.getElementById('activeUsers').textContent = active;
    }
    
    function getRoleLabel(role) {
      const labels = { student: '学生', teacher: '教师', admin: '管理员' };
      return labels[role] || role;
    }
    
    function formatDate(dateString) {
      if (!dateString) return '-';
      const date = new Date(dateString);
      return date.toLocaleDateString('zh-CN');
    }
    
    function showAlert(elementId, message, type = 'error') {
      const alert = document.getElementById(elementId);
      alert.textContent = message;
      alert.className = `alert alert-${type}`;
      alert.style.display = 'block';
      setTimeout(() => alert.style.display = 'none', 5000);
    }
    
    function showLoading(show) {
      document.getElementById('loading').style.display = show ? 'block' : 'none';
    }
    
    function clearAddForm() {
      document.getElementById('username').value = '';
      document.getElementById('name').value = '';
      document.getElementById('class').value = '';
      document.getElementById('password').value = '';
    }
    
    function resetSearch() {
      document.getElementById('searchInput').value = '';
      renderUserTable(usersCache);
    }
    
    function addTableStyles() {
      const style = document.createElement('style');
      style.textContent = `
        .role-badge { 
          background: #e9ecef; 
          padding: 2px 8px; 
          border-radius: 12px; 
          font-size: 12px; 
        }
        .status-badge { 
          padding: 2px 8px; 
          border-radius: 12px; 
          font-size: 12px; 
        }
        .status-badge.active { 
          background: #d4edda; 
          color: #155724; 
        }
        .status-badge.inactive { 
          background: #f8d7da; 
          color: #721c24; 
        }
        .action-btn { 
          padding: 4px 8px; 
          font-size: 12px; 
          border-radius: 3px; 
          cursor: pointer; 
        }
      `;
      document.head.appendChild(style);
    }
    
  </script>
</body>
</html>
