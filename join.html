<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加入我们 - 武威第十八中学卓然创客社团</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f4f4;
        }
        
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }
        
        /* 导航栏样式 */
        .navbar {
            background-color: #2c3e50;
            color: white;
            padding: 15px 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .nav-logo h2 a {
            color: white;
            text-decoration: none;
        }
        
        .nav-menu {
            list-style: none;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .nav-menu a {
            color: white;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 3px;
            transition: background-color 0.3s;
        }
        
        .nav-menu a:hover, .nav-menu a.active {
            background-color: #3498db;
        }
        
        /* 主要内容区域 */
        .main-content {
            margin-top: 100px;
            padding: 40px 0;
        }
        
        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .page-header h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 15px;
        }
        
        .join-form {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            margin: 0 auto;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 1em;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        .form-group textarea {
            height: 120px;
            resize: vertical;
        }
        
        .required {
            color: #e74c3c;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1.1em;
        }
        
        .btn-primary {
            background-color: #e74c3c;
        }
        
        .btn-primary:hover {
            background-color: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .form-actions {
            text-align: center;
            margin-top: 30px;
        }
        
        /* 社团介绍部分 */
        .club-intro {
            background: #ecf0f1;
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        
        .club-intro h3 {
            color: #2c3e50;
            margin-bottom: 15px;
        }
        
        .club-intro ul {
            list-style: none;
            padding-left: 20px;
        }
        
        .club-intro li {
            margin-bottom: 10px;
            position: relative;
            padding-left: 20px;
        }
        
        .club-intro li:before {
            content: "•";
            color: #3498db;
            font-weight: bold;
            position: absolute;
            left: 0;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .nav-menu {
                flex-direction: column;
                gap: 10px;
            }
            
            .join-form {
                padding: 20px;
            }
            
            .main-content {
                margin-top: 120px;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container nav-container">
            <div class="nav-logo">
                <h2><a href="index.html">卓然创客</a></h2>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">首页</a></li>
                <li><a href="about.html">关于我们</a></li>
                <li><a href="activities.html">活动展示</a></li>
                <li><a href="projects.html">项目成果</a></li>
                <li><a href="join.html" class="active">加入我们</a></li>
            </ul>
        </div>
    </nav>

    <!-- 主要内容区域 -->
    <div class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>加入卓然创客社团</h1>
                <p>填写申请表，开启您的创新之旅</p>
            </div>
            
            <div class="club-intro">
                <h3>为什么加入我们？</h3>
                <ul>
                    <li>接触前沿技术：3D打印、机器人编程、物联网等</li>
                    <li>参与真实项目：将理论知识转化为实际成果</li>
                    <li>专业导师指导：5位经验丰富的专业导师</li>
                    <li>团队协作能力：培养沟通和领导能力</li>
                    <li>创意孵化平台：为您的创意提供技术支持</li>
                </ul>
            </div>
            
            <form id="joinForm" class="join-form">
                <div class="form-group">
                    <label for="name">姓名 <span class="required">*</span></label>
                    <input type="text" id="name" name="name" required placeholder="请输入您的真实姓名">
                </div>
                
                <div class="form-group">
                    <label for="studentId">学号 <span class="required">*</span></label>
                    <input type="text" id="studentId" name="studentId" required placeholder="请输入您的学号">
                </div>
                
                <div class="form-group">
                    <label for="grade">年级班级 <span class="required">*</span></label>
                    <input type="text" id="grade" name="grade" required placeholder="例如：高一(3)班">
                </div>
                
                <div class="form-group">
                    <label for="phone">联系电话 <span class="required">*</span></label>
                    <input type="tel" id="phone" name="phone" required placeholder="请输入您的联系电话">
                </div>
                
                <div class="form-group">
                    <label for="email">电子邮箱</label>
                    <input type="email" id="email" name="email" placeholder="请输入您的电子邮箱">
                </div>
                
                <div class="form-group">
                    <label for="interest">感兴趣的方向 <span class="required">*</span></label>
                    <select id="interest" name="interest" required>
                        <option value="">请选择您感兴趣的方向</option>
                        <option value="3d-printing">3D打印与建模</option>
                        <option value="robot">机器人编程</option>
                        <option value="iot">物联网技术</option>
                        <option value="web">网站与应用程序开发</option>
                        <option value="design">创意设计与制作</option>
                        <option value="other">其他</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="experience">相关经验或技能</label>
                    <textarea id="experience" name="experience" placeholder="请简要描述您在该领域的相关经验或技能（如无经验可写'无'）"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="reason">申请理由 <span class="required">*</span></label>
                    <textarea id="reason" name="reason" required placeholder="请说明您为什么想加入我们社团，以及您期望获得什么"></textarea>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">提交申请</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 页脚 -->
    <footer style="background: #2c3e50; color: white; padding: 40px 0; margin-top: 60px;">
        <div class="container">
            <div style="text-align: center;">
                <p>&copy; 2025 武威第十八中学卓然创客社团. All rights reserved.</p>
                <p>联系我们：2959665467@qq.com | 电话：17793528289</p>
            </div>
        </div>
    </footer>

    <script>
        // 表单提交处理
        document.getElementById('joinForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            // 获取表单数据
            const formData = {
                name: document.getElementById('name').value,
                studentId: document.getElementById('studentId').value,
                grade: document.getElementById('grade').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                interest: document.getElementById('interest').value,
                experience: document.getElementById('experience').value,
                reason: document.getElementById('reason').value
            };
            
            // 简单验证
            if (!formData.name || !formData.studentId || !formData.grade || !formData.phone || !formData.reason) {
                alert('请填写所有必填字段（标记为*的字段）');
                return;
            }
            
            // 在实际应用中，这里应该将数据发送到服务器
            // 这里我们只是模拟提交成功
            alert('申请提交成功！我们会尽快审核并与您联系。');
            
            // 重置表单
            this.reset();
        });
        
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            console.log('加入我们页面加载完成');
        });
    </script>
</body>
</html>
