<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 卓然创客社团</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h2 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .login-header p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .remember-me input {
            margin-right: 10px;
        }
        
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 10px;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            color: #e74c3c;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
        
        .success-message {
            color: #27ae60;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
        
        .test-accounts {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 14px;
        }
        
        .test-accounts h4 {
            margin-bottom: 10px;
            color: #333;
        }
        
        .oauth-buttons {
            margin-top: 20px;
            text-align: center;
        }
        
        .oauth-btn {
            display: inline-block;
            padding: 10px 15px;
            margin: 5px;
            background: #f1f1f1;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2>欢迎回来</h2>
            <p>登录您的卓然创客社团账户</p>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">邮箱地址</label>
                <input type="email" id="email" name="email" placeholder="请输入邮箱地址" required>
            </div>
            
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>
            
            <div class="remember-me">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">记住登录状态</label>
            </div>
            
            <button type="submit" class="login-btn">登录</button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在验证身份...</p>
            </div>
            
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
        </form>

        <div class="oauth-buttons">
            <button class="oauth-btn" onclick="signInWithOAuth('github')">使用 GitHub 登录</button>
            <button class="oauth-btn" onclick="signInWithOAuth('google')">使用 Google 登录</button>
        </div>
        
        <div class="test-accounts">
            <h4>测试账户信息</h4>
            <p><strong>提示：</strong>请使用在Supabase中注册的真实账户</p>
            <p>首次使用需要先注册账户</p>
        </div>
    </div>

    <!-- 引入Supabase客户端库 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // 初始化Supabase客户端[1,6](@ref)
        const supabaseUrl = 'https://wxbemuwgiiucdgmbhbvg.supabase.co';
        const supabaseKey = 'sb_publishable_KuzTRmYOZ9P6UmKgmb_VwA_6Qj_A6Nk';
        
        // 使用单例模式避免重复声明
        if (!window.supabaseClient) {
            window.supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
        }
        const supabase = window.supabaseClient;

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const loading = document.getElementById('loading');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            
            // 检查是否有保存的登录信息
            checkCurrentSession();
            
            // 表单提交事件 - 使用Supabase进行真实登录[3,6](@ref)
            loginForm.addEventListener('submit', async function(event) {
                event.preventDefault();
                
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const rememberMe = document.getElementById('remember').checked;
                
                // 显示加载动画
                loading.style.display = 'block';
                errorMessage.style.display = 'none';
                successMessage.style.display = 'none';
                
                try {
                    // 使用Supabase进行邮箱密码登录[3](@ref)
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: email,
                        password: password
                    });
                    
                    if (error) {
                        throw error;
                    }
                    
                    if (data.user) {
                        // 登录成功
                        showSuccess('登录成功！正在跳转到会员中心...');
                        
                        // 保存登录状态
                        if (rememberMe) {
                            localStorage.setItem('supabaseSession', JSON.stringify(data.session));
                        }
                        
                        sessionStorage.setItem('isLoggedIn', 'true');
                        sessionStorage.setItem('currentUser', JSON.stringify(data.user));
                        
                        // 2秒后跳转到会员中心页面[6](@ref)
                        setTimeout(() => {
                            window.location.href = 'member.html';
                        }, 2000);
                    }
                    
                } catch (error) {
                    // 登录失败
                    showError('登录失败：' + error.message);
                } finally {
                    loading.style.display = 'none';
                }
            });
            
            // 实时验证输入
            document.getElementById('email').addEventListener('input', function() {
                errorMessage.style.display = 'none';
            });
            
            document.getElementById('password').addEventListener('input', function() {
                errorMessage.style.display = 'none';
            });
        });

        // 检查当前会话状态[1](@ref)
        async function checkCurrentSession() {
            try {
                const { data: { session }, error } = await supabase.auth.getSession();
                if (session?.user) {
                    // 如果已有有效会话，直接跳转
                    sessionStorage.setItem('isLoggedIn', 'true');
                    sessionStorage.setItem('currentUser', JSON.stringify(session.user));
                    window.location.href = 'member.html';
                }
            } catch (error) {
                console.log('无有效会话，需要登录');
            }
        }

        // OAuth登录函数[4,5](@ref)
        async function signInWithOAuth(provider) {
            try {
                const { data, error } = await supabase.auth.signInWithOAuth({
                    provider: provider,
                    options: {
                        redirectTo: window.location.origin + '/member.html'
                    }
                });
                
                if (error) throw error;
            } catch (error) {
                showError('OAuth登录失败：' + error.message);
            }
        }

        // 显示错误消息
        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        // 显示成功消息
        function showSuccess(message) {
            const successMessage = document.getElementById('successMessage');
            successMessage.textContent = message;
            successMessage.style.display = 'block';
        }

        // 检查登录状态函数
        function checkLoginStatus() {
            return sessionStorage.getItem('isLoggedIn') === 'true';
        }

        // 获取当前用户信息
        function getCurrentUser() {
            const userData = sessionStorage.getItem('currentUser');
            return userData ? JSON.parse(userData) : null;
        }
    </script>
</body>
</html>
