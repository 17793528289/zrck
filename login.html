<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录/注册 - 卓然创客社团</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 自定义 Tailwind 配置 -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#03fc90',
                        secondary: '#fc03f8',
                        dark: '#121212',
                        'dark-light': '#1e1e1e',
                        'dark-lighter': '#2a2a2a'
                    },
                    fontFamily: {
                        sans: ['Inter', 'Roboto', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .text-gradient {
                background: linear-gradient(135deg, #03fc90 0%, #fc03f8 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
            .bg-glass {
                background: rgba(255, 255, 255, 0.1);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.2);
            }
            .card-hover {
                transition: all 0.3s ease;
            }
            .card-hover:hover {
                transform: translateY(-5px);
                box-shadow: 0 20px 40px rgba(3, 252, 144, 0.1);
            }
            .form-input {
                @apply w-full px-4 py-3 bg-dark-light border border-white/10 rounded-lg focus:outline-none focus:border-primary text-white transition-colors;
            }
            .btn-primary {
                @apply w-full py-3 rounded-lg bg-gradient-to-r from-primary to-secondary text-dark font-bold hover:opacity-90 transition-opacity;
            }
            .btn-secondary {
                @apply w-full py-3 rounded-lg border border-primary text-primary font-bold hover:bg-primary/10 transition-colors;
            }
            .tab-active {
                @apply bg-gradient-to-r from-primary to-secondary text-dark font-bold;
            }
            .tab-inactive {
                @apply bg-dark-light text-gray-400 hover:bg-dark-lighter transition-colors;
            }
        }
    </style>
</head>
<body class="bg-dark text-white min-h-screen font-sans">
    <!-- 导航栏 -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-glass border-b border-white/10">
        <div class="container mx-auto px-4 py-3">
            <div class="flex justify-between items-center">
                <!-- Logo -->
                <a href="index.html" class="flex items-center space-x-3 group">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-r from-primary to-secondary flex items-center justify-center transition-transform group-hover:scale-110">
                        <i class="fas fa-robot text-white text-xl"></i>
                    </div>
                    <span class="text-xl font-bold text-gradient">卓然创客</span>
                </a>

                <!-- 桌面端导航 -->
                <div class="hidden lg:flex items-center space-x-8">
                    <a href="index.html" class="nav-link">首页</a>
                    <a href="about.html" class="nav-link">社团简介</a>
                    <a href="activities.html" class="nav-link">社团活动</a>
                    <a href="showcase.html" class="nav-link">社团展示</a>
                    <a href="visitor-center.html" class="nav-link">访客中心</a>
                    <a href="chat.html" class="nav-link">聊天系统</a>
                    <a href="login.html" class="nav-link active">登录/注册</a>
                </div>

                <!-- 移动端菜单按钮 -->
                <div class="lg:hidden flex items-center space-x-4">
                    <button id="theme-toggle" class="p-2 rounded-lg bg-dark-light hover:bg-dark-lighter transition-colors">
                        <i class="fas fa-moon"></i>
                    </button>
                    <button id="mobile-menu-button" class="p-2 rounded-lg bg-dark-light hover:bg-dark-lighter transition-colors">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                </div>
            </div>

            <!-- 移动端导航菜单 -->
            <div id="mobile-menu" class="lg:hidden hidden mt-4 pb-4 border-t border-white/10 pt-4">
                <div class="flex flex-col space-y-4">
                    <a href="index.html" class="nav-link-mobile">首页</a>
                    <a href="about.html" class="nav-link-mobile">社团简介</a>
                    <a href="activities.html" class="nav-link-mobile">社团活动</a>
                    <a href="showcase.html" class="nav-link-mobile">社团展示</a>
                    <a href="visitor-center.html" class="nav-link-mobile">访客中心</a>
                    <a href="chat.html" class="nav-link-mobile">聊天系统</a>
                    <a href="login.html" class="nav-link-mobile active">登录/注册</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 登录/注册页面 -->
    <section class="min-h-screen flex items-center justify-center px-4 py-20">
        <div class="container mx-auto max-w-md">
            <!-- 登录/注册卡片 -->
            <div class="bg-dark-light rounded-2xl p-8 border border-white/10 card-hover">
                <!-- 标题 -->
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-bold text-gradient mb-2">用户登录</h2>
                    <p class="text-gray-400 text-sm">请使用管理员或教师分配的账号密码登录</p>
                </div>

                <!-- 登录表单 -->
                <form id="login-form" class="space-y-6">
                    <div>
                        <label for="login-account" class="block text-sm font-medium text-gray-300 mb-2">账号</label>
                        <input type="text" id="login-account" name="account" class="form-input" placeholder="请输入您的账号（例如：2025020101）" required>
                        <div id="login-email-error" class="text-red-500 text-sm mt-1 hidden"></div>
                    </div>
                    
                    <div>
                        <label for="login-password" class="block text-sm font-medium text-gray-300 mb-2">密码</label>
                        <input type="password" id="login-password" name="password" class="form-input" placeholder="请输入您的密码" required>
                        <div id="login-password-error" class="text-red-500 text-sm mt-1 hidden"></div>
                    </div>
                    
                    <div class="flex items-center justify-between">
                        <label class="flex items-center">
                            <input type="checkbox" id="remember-me" class="w-4 h-4 text-primary bg-dark-light border-white/10 rounded focus:ring-primary focus:ring-2">
                            <span class="ml-2 text-sm text-gray-400">记住我</span>
                        </label>
                        <a href="#forgot-password" class="text-sm text-primary hover:underline">忘记密码？</a>
                    </div>
                    
                    <button type="submit" class="btn-primary">
                        <span id="login-btn-text">登录</span>
                        <span id="login-loading" class="hidden">
                            <i class="fas fa-spinner fa-spin mr-2"></i>登录中...
                        </span>
                    </button>
                    
                    <div class="text-center text-sm text-gray-400">
                        请使用管理员或教师分配的账号密码登录
                    </div>
                </form>

                <!-- 忘记密码表单 -->
                <form id="forgot-password-form" class="space-y-6 hidden">
                    <div class="text-center mb-6">
                        <i class="fas fa-key text-4xl text-primary mb-4"></i>
                        <h3 class="text-xl font-bold">重置密码</h3>
                        <p class="text-gray-400 text-sm mt-2">输入您的邮箱地址，我们将发送重置密码的链接</p>
                    </div>
                    
                    <div>
                        <label for="reset-email" class="block text-sm font-medium text-gray-300 mb-2">邮箱地址</label>
                        <input type="email" id="reset-email" name="email" class="form-input" placeholder="请输入您的邮箱" required>
                        <div id="reset-email-error" class="text-red-500 text-sm mt-1 hidden"></div>
                    </div>
                    
                    <button type="submit" class="btn-primary">
                        <span id="reset-btn-text">发送重置链接</span>
                        <span id="reset-loading" class="hidden">
                            <i class="fas fa-spinner fa-spin mr-2"></i>发送中...
                        </span>
                    </button>
                    
                    <div class="text-center">
                        <a href="#" id="back-to-login" class="text-primary hover:underline text-sm">返回登录</a>
                    </div>
                </form>
            </div>

            <!-- 社交登录 -->
            <div class="mt-8 text-center">
                <div class="relative mb-4">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-white/10"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-dark-light text-gray-400">或使用以下方式登录</span>
                    </div>
                </div>
                
                <div class="flex justify-center space-x-4">
                    <button class="w-12 h-12 rounded-full bg-dark-light border border-white/10 flex items-center justify-center hover:bg-dark-lighter transition-colors group">
                        <i class="fab fa-weixin text-green-500 group-hover:text-green-400"></i>
                    </button>
                    <button class="w-12 h-12 rounded-full bg-dark-light border border-white/10 flex items-center justify-center hover:bg-dark-lighter transition-colors group">
                        <i class="fab fa-qq text-blue-500 group-hover:text-blue-400"></i>
                    </button>
                    <button class="w-12 h-12 rounded-full bg-dark-light border border-white/10 flex items-center justify-center hover:bg-dark-lighter transition-colors group">
                        <i class="fas fa-envelope text-primary group-hover:text-primary/80"></i>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- 消息提示容器 -->
    <div id="notification-container" class="fixed top-4 right-4 z-50 space-y-2 max-w-sm"></div>

    <!-- Supabase 配置 -->
    <script src="lib/supabase.js"></script>
    <!-- 工具函数 -->
    <script src="assets/js/utils.js"></script>
    <!-- 主脚本 -->
    <script src="assets/js/main.js"></script>

    <!-- 登录/注册页面专用脚本 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 元素引用
            const loginForm = document.getElementById('login-form');
            const forgotPasswordForm = document.getElementById('forgot-password-form');
            const backToLogin = document.getElementById('back-to-login');
            const forgotPasswordLink = document.querySelector('a[href="#forgot-password"]');

            // 切换到忘记密码表单
            function switchToForgotPassword() {
                loginForm.classList.add('hidden');
                forgotPasswordForm.classList.remove('hidden');
            }

            // 切换到登录表单
            function switchToLoginTab() {
                loginForm.classList.remove('hidden');
                forgotPasswordForm.classList.add('hidden');
            }

            // 事件监听器
            backToLogin.addEventListener('click', function(e) {
                e.preventDefault();
                switchToLoginTab();
            });
            forgotPasswordLink.addEventListener('click', function(e) {
                e.preventDefault();
                switchToForgotPassword();
            });

            // 清除错误信息
            function clearErrors() {
                document.querySelectorAll('[id$="-error"]').forEach(el => {
                    el.classList.add('hidden');
                    el.textContent = '';
                });
            }

            // 显示错误信息
            function showError(fieldId, message) {
                const errorEl = document.getElementById(fieldId);
                if (errorEl) {
                    errorEl.textContent = message;
                    errorEl.classList.remove('hidden');
                }
            }

            // 显示成功消息
            function showSuccess(message, type = 'success') {
                if (window.App && window.App.utils) {
                    window.App.utils.notification[type](message);
                } else {
                    // 降级处理
                    alert(message);
                }
            }

            // 设置加载状态
            function setLoading(button, isLoading) {
                const btnText = button.querySelector('#login-btn-text, #register-btn-text, #reset-btn-text');
                const loading = button.querySelector('#login-loading, #register-loading, #reset-loading');
                
                if (isLoading) {
                    btnText.classList.add('hidden');
                    loading.classList.remove('hidden');
                    button.disabled = true;
                } else {
                    btnText.classList.remove('hidden');
                    loading.classList.add('hidden');
                    button.disabled = false;
                }
            }

            // 登录表单提交
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                clearErrors();
                
                const formData = new FormData(loginForm);
                const account = formData.get('account').trim();
                const password = formData.get('password');
                const submitButton = loginForm.querySelector('button[type="submit"]');

                // 基本验证
                if (!account) {
                    showError('login-email-error', '请输入账号');
                    return;
                }

                if (!password) {
                    showError('login-password-error', '请输入密码');
                    return;
                }

                setLoading(submitButton, true);

                try {
                    // 使用AuthService进行登录
                    if (window.AuthService) {
                        const { data, error } = await window.AuthService.signIn(account, password);
                        
                        if (error) {
                            throw error;
                        }

                        if (data) {
                            showSuccess('登录成功！', 'success');
                            
                            // 保存登录状态（使用try-catch避免存储访问被阻止的问题）
                            try {
                                if (document.getElementById('remember-me').checked) {
                                    localStorage.setItem('rememberMe', 'true');
                                }
                            } catch (storageError) {
                                console.warn('存储登录状态失败:', storageError.message);
                            }
                            
                            // 跳转到用户中心
                            setTimeout(() => {
                                // 检查用户角色，跳转到相应页面
                                let userRole = 'member'; // 默认角色
                                
                                // 尝试从多个位置获取角色信息
                                if (data.user) {
                                    userRole = data.user.role || 
                                               data.user.user_metadata?.role || 
                                               data.user.app_metadata?.role || 
                                               'member';
                                }
                                
                                // 对于后端账号，尝试从模拟账号映射中获取角色
                                const account = formData.get('account').trim();
                                const mockUser = window.accountMap?.[account];
                                if (mockUser) {
                                    userRole = mockUser.role;
                                }
                                
                                console.log('用户角色:', userRole);
                                
                                // 检查角色并跳转
                                if (userRole === 'admin' || userRole === 'teacher') {
                                    window.location.href = 'admin.html';
                                } else {
                                    window.location.href = 'member-center.html';
                                }
                            }, 1000);
                        }
                    } else {
                        throw new Error('认证系统未初始化');
                    }
                } catch (error) {
                    console.error('登录失败:', error);
                    let errorMessage = '登录失败，请稍后重试';
                    
                    if (error.message.includes('Invalid login credentials') || error.message.includes('账号或密码错误')) {
                        errorMessage = '账号或密码错误';
                    } else if (error.message.includes('Email not confirmed')) {
                        errorMessage = '请先验证您的邮箱';
                    } else if (error.message.includes('Too many requests')) {
                        errorMessage = '请求过于频繁，请稍后重试';
                    } else if (error.message.includes('Account not found') || error.message.includes('账号不存在')) {
                        errorMessage = '账号不存在';
                    }
                    
                    showError('login-password-error', errorMessage);
                    showSuccess(errorMessage, 'error');
                } finally {
                    setLoading(submitButton, false);
                }
            });

            // 忘记密码表单提交
            forgotPasswordForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                clearErrors();
                
                const formData = new FormData(forgotPasswordForm);
                const email = formData.get('email').trim();
                const submitButton = forgotPasswordForm.querySelector('button[type="submit"]');

                if (!email) {
                    showError('reset-email-error', '请输入邮箱地址');
                    return;
                }

                // 邮箱格式验证
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    showError('reset-email-error', '请输入有效的邮箱地址');
                    return;
                }

                setLoading(submitButton, true);

                try {
                    // 使用Supabase发送密码重置邮件
                    if (window.App && window.App.auth) {
                        const { data, error } = await window.App.auth.resetPassword(email);
                        
                        if (error) {
                            throw error;
                        }

                        if (data) {
                            showSuccess('密码重置邮件已发送，请检查您的邮箱', 'success');
                            
                            // 清空表单
                            forgotPasswordForm.reset();
                            
                            // 切换到登录标签页
                            setTimeout(() => {
                                switchToLoginTab();
                            }, 2000);
                        }
                    } else {
                        throw new Error('认证系统未初始化');
                    }
                } catch (error) {
                    console.error('密码重置失败:', error);
                    let errorMessage = '发送重置链接失败，请稍后重试';
                    
                    if (error.message.includes('Email not found')) {
                        errorMessage = '该邮箱未注册';
                    } else if (error.message.includes('Invalid email')) {
                        errorMessage = '邮箱格式不正确';
                    }
                    
                    showError('reset-email-error', errorMessage);
                    showSuccess(errorMessage, 'error');
                } finally {
                    setLoading(submitButton, false);
                }
            });
        });
    </script>
</body>
</html>
